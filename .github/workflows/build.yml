name: CI - Full System Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Static Code Analysis Job
  lint:
    runs-on: ubuntu-latest
    name: Code Quality Check
    
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install ESLint
      run: npm install -g eslint

    - name: Lint Identity Service
      working-directory: ./services/identity
      run: |
        npm install
        npm run lint || echo "::warning::Identity service has linting issues"
      continue-on-error: true

    - name: Lint Catalog Service
      working-directory: ./services/catalog
      run: |
        npm install
        npm run lint || echo "::warning::Catalog service has linting issues"
      continue-on-error: true

    - name: Lint Frontend
      working-directory: ./frontend
      run: |
        npm install
        npm run lint || echo "::warning::Frontend has linting issues"
      continue-on-error: true

  # Build and Integration Test Job
  build-and-test:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build and Start Containers
      run: |
        docker compose up -d --build
        echo "Waiting for services to start..."
        sleep 30

    - name: Check Container Status
      run: docker compose ps

    - name: Wait for Databases & Kafka
      run: |
        echo "Waiting for databases to be healthy..."
        # Loop until all DBs are healthy (timeout after 2 mins)
        attempt=0
        until [ $attempt -ge 12 ]
        do
          if [ "$(docker inspect -f {{.State.Health.Status}} fiks-identity-db-1)" == "healthy" ] && \
             [ "$(docker inspect -f {{.State.Health.Status}} fiks-catalog-db-1)" == "healthy" ] && \
             [ "$(docker inspect -f {{.State.Health.Status}} fiks-kafka-1)" == "healthy" ]; then
            echo "Core services are healthy!"
            break
          fi
          echo "Waiting for health checks... (Attempt: $attempt)"
          attempt=$((attempt+1))
          sleep 10
        done

    - name: Verify Service Endpoints (Health Checks)
      run: |
        echo "Testing Identity Service..."
        curl --fail http://localhost:3001/health || exit 1
        
        echo "Testing Catalog Service..."
        curl --fail http://localhost:3002/health || exit 1
        
        echo "Testing Booking Service..."
        curl --fail http://localhost:3003/health || exit 1
        
        echo "Testing Feedback Service..."
        curl --fail http://localhost:3004/health || exit 1
        
        echo "Testing Gateway..."
        curl --fail http://localhost:8080/health || exit 1
        
        echo "Testing Metrics Endpoint..."
        curl --fail http://localhost:3001/metrics || exit 1

    - name: Show Service Logs on Failure
      if: failure()
      run: docker compose logs

    - name: Stop Containers
      if: always()
      run: docker compose down
