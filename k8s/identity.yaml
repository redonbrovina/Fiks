apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
        - name: identity
          image: fiks-identity:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@identity-db:5432/identity"
            - name: JWT_SECRET
              value: "your-super-secret-jwt-key"
            - name: JWT_REFRESH_SECRET
              value: "your-refresh-secret-key"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: RESEND_API_KEY
              value: "re_47wMojH5_9FsEcvarWQmS2oCwWnLdrMht"
            - name: FRONTEND_URL
              value: "http://frontend"
---
apiVersion: v1
kind: Service
metadata:
  name: identity
spec:
  selector:
    app: identity
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
